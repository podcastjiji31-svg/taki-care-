
<!-- TAKI AI - Professional Workspace -->
<style>
#taki-ai {
  direction: rtl;
  font-family: Arial, sans-serif;
  background: #f1f7fa;
  padding: 35px 5%;
  color: #17334b;
}
#taki-ai .panel {
  max-width: 950px;
  margin: 20px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 20px #102b4615;
}
#taki-ai h2, #taki-ai h3 { color: #102b46; }
#taki-ai input, #taki-ai select, #taki-ai textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ccd9e2;
  border-radius: 8px;
  font-size: 15px;
  box-sizing: border-box;
}
#taki-ai textarea { min-height: 120px; }
#taki-ai button {
  background: #159e91;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 13px 20px;
  cursor: pointer;
  margin: 5px;
}
#taki-ai button.secondary { background: #173b59; }
#taki-ai .patient-item {
  padding: 15px;
  border: 1px solid #dce7ed;
  border-radius: 10px;
  margin: 10px 0;
}
#taki-ai .hidden { display: none; }
#taki-ai .notice {
  background: #fff6df;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
}
#taki-ai #message { white-space: pre-wrap; }
</style>

<section id="taki-ai">
  <div class="panel">
    <h2>TAKI AI</h2>
    <p>المساعد المهني للتقييم والتأهيل والمتابعة</p>
    <p class="notice">
      مساحة مهنية تجريبية. لا تدخلي بيانات مرضى حقيقية قبل
      استكمال مراجعة الأمن والصلاحيات والامتثال القانوني.
    </p>
  </div>

  <div class="panel" id="auth-panel">
    <h3>فضاء المختص</h3>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email"
      placeholder="Email">

    <label>كلمة المرور</label>
    <input id="password" type="password"
      autocomplete="current-password" placeholder="Password">

    <button id="signup">إنشاء حساب</button>
    <button id="login" class="secondary">تسجيل الدخول</button>
    <p id="auth-message"></p>
  </div>

  <div id="workspace" class="hidden">
    <div class="panel">
      <h3>مرحباً بك في فضائك المهني</h3>
      <p id="user-email"></p>
      <button id="logout" class="secondary">تسجيل الخروج</button>
    </div>

    <div class="panel">
      <h3>إنشاء ملف مفحوص جديد</h3>

      <label>رمز الملف (بدون اسم أو معلومات تعريفية)</label>
      <input id="case-code" placeholder="مثال: TAKI-001">

      <label>الفئة</label>
      <select id="age-group">
        <option value="child">طفل</option>
        <option value="adult">بالغ</option>
      </select>

      <label>ملاحظات Anamnèse</label>
      <textarea id="anamnesis"
        placeholder="تاريخ الحالة، الشكوى، التطور، المعلومات السريرية..."></textarea>

      <button id="save-patient">حفظ الملف والتقييم</button>
      <p id="save-message"></p>
    </div>

    <div class="panel">
      <h3>ملفات المفحوصين</h3>
      <button id="refresh-patients" class="secondary">
        تحديث القائمة
      </button>
      <div id="patient-list"></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL =
    "https://uplrnpbtelciryfjgnsk.supabase.co";

  // ضعي هنا Publishable Key الخاص بمشروع Supabase
  const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const authPanel = document.getElementById("auth-panel");
  const workspace = document.getElementById("workspace");
  const authMessage = document.getElementById("auth-message");

  if (!window.supabase ||
      SUPABASE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
    authMessage.textContent =
      "يجب إضافة Publishable Key لإكمال الاتصال.";
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = id => document.getElementById(id);

  async function showSession(session) {
    const loggedIn = !!session;
    authPanel.classList.toggle("hidden", loggedIn);
    workspace.classList.toggle("hidden", !loggedIn);

    if (loggedIn) {
      $("user-email").textContent = session.user.email;
      await loadPatients();
    }
  }

  $("signup").onclick = async function () {
    const { error } = await db.auth.signUp({
      email: $("email").value.trim(),
      password: $("password").value
    });

    authMessage.textContent = error
      ? error.message
      : "تم إنشاء الطلب. تحققي من بريدك الإلكتروني لتأكيد الحساب.";
  };

  $("login").onclick = async function () {
    const { error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    authMessage.textContent = error
      ? error.message
      : "تم تسجيل الدخول.";
  };

  $("logout").onclick = async function () {
    const { error } = await db.auth.signOut();
    if (error) alert(error.message);
  };

  $("save-patient").onclick = async function () {
    const message = $("save-message");
    const caseCode = $("case-code").value.trim();
    const notes = $("anamnesis").value.trim();

    if (!caseCode) {
      message.textContent = "أدخلي رمز الملف أولاً.";
      return;
    }

    message.textContent = "جارٍ الحفظ...";

    const { data: patient, error: patientError } =
      await db.from("patients").insert({
        case_code: caseCode,
        age_group: $("age-group").value
      }).select().single();

    if (patientError) {
      message.textContent = "تعذر حفظ الملف: " + patientError.message;
      return;
    }

    if (notes) {
      const { error: assessmentError } =
        await db.from("assessments").insert({
          patient_id: patient.id,
          clinical_data: {
            anamnesis: notes
          }
        });

      if (assessmentError) {
        message.textContent =
          "تم حفظ الملف لكن تعذر حفظ التقييم: " +
          assessmentError.message;
        await loadPatients();
        return;
      }
    }

    message.textContent = "تم حفظ الملف بنجاح.";
    $("case-code").value = "";
    $("anamnesis").value = "";
    await loadPatients();
  };

  async function loadPatients() {
    const list = $("patient-list");
    list.textContent = "جارٍ تحميل الملفات...";

    const { data, error } = await db
      .from("patients")
      .select("id, case_code, age_group, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      list.textContent = "تعذر تحميل الملفات: " + error.message;
      return;
    }

    list.replaceChildren();

    if (!data || data.length === 0) {
      list.textContent = "لا توجد ملفات حتى الآن.";
      return;
    }

    data.forEach(patient => {
      const item = document.createElement("div");
      item.className = "patient-item";

      const title = document.createElement("strong");
      title.textContent = patient.case_code;

      const details = document.createElement("p");
      details.textContent =
        (patient.age_group === "child" ? "طفل" : "بالغ") +
        " — " +
        new Date(patient.created_at).toLocaleDateString();

      item.append(title, details);
      list.appendChild(item);
    });
  }

  $("refresh-patients").onclick = loadPatients;

  db.auth.onAuthStateChange((event, session) => {
    showSession(session);
  });

  db.auth.getSession().then(({ data }) => {
    showSession(data.session);
  });
})();
</script>
<!-- End TAKI AI -->
